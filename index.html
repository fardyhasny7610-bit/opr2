<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Path Open Redirect Lab</title>
</head>
<body>

    <h1>Open Redirect Lab</h1>
    <p>Halaman utama lab berhasil dibuka.</p>

   
<script>
    // Intentionally vulnerable Open Redirect Lab

    const basePath = '/opr2/';
    const currentPath = window.location.pathname;

    // Mengambil path setelah prefix repository
    const path = currentPath.startsWith(basePath)
        ? currentPath.substring(basePath.length)
        : '';

    // Redirect jika path diawali //
    if (path.startsWith('//')) {
        window.location.replace('https:' + path);
    }
</script>


</body>
</html>
